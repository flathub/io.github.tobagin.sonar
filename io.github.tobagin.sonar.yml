app-id: io.github.tobagin.sonar
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sonar
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"

modules:
  - name: ngrok
    buildsystem: simple
    build-commands:
      - tar -xzf ngrok.tgz
      - install -Dm755 ngrok ${FLATPAK_DEST}/bin/ngrok
    sources:
      - type: file
        url: https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        sha256: 233e0647849913e6404150c1e9c5e4f31c1368aefee330958d038d7afecb8f2e
        dest-filename: ngrok.tgz
        only-arches: [x86_64]
      - type: file
        url: https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-arm64.tgz
        sha256: fb41ee8f251969f6e399ef03122f791ae537155dfd9ac4c0baf108aca95c17d7
        dest-filename: ngrok.tgz
        only-arches: [aarch64]

  - name: sonar
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/tobagin/Sonar.git
        tag: v2.6.1
        commit: ff65d9fe48d7d0e3247253d9f2a0058daeaadd16